[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-propagator"
version = "0.1.0"
description = "Native Python DSST Monte Carlo propagation of orbital uncertainty"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
distribution-propagator = "distribution_propagator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distribution_propagator = ["resources/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
